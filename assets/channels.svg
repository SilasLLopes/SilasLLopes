<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Three channels: Agents, Networks, Products">
<style>
.w{animation:mv 2.2s linear infinite} .w1{animation-duration:2.8s} .w2{animation-duration:1.8s}
@keyframes mv{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.eq{transform-box:fill-box;transform-origin:bottom;animation:eq 1.1s ease-in-out infinite}
.e1{animation-delay:-.3s}.e2{animation-delay:-.6s}.e3{animation-delay:-.85s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
</style>
