    <text x="28" y="118" font-size="16" fill="#A9B8D0" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">LLMs that reason, pick a tool</text><text x="28" y="142" font-size="16" fill="#A9B8D0" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">and finish the job — not chatbots</text><text x="28" y="166" font-size="16" fill="#A9B8D0" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">that stop at an answer.</text>
