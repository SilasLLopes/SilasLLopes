<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Silas Lopes — AI Engineer. Agents that act on real networks.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/>
      <stop offset="0.6" stop-color="#0A1222"/>
      <stop offset="1" stop-color="#101A33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#BFF4FF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E2B47"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="22"/></clipPath>
    <clipPath id="radarClip"><circle cx="985" cy="190" r="120"/></clipPath>
  </defs>

  <style>
    .fiber { fill: none; stroke-width: 2; stroke-linecap: round; }
    .base  { stroke: #16233D; }
    .pulse { stroke-dasharray: 70 1400; animation: flow 6s linear infinite; }
    .p2 { animation-duration: 8s; animation-delay: -2s; }
    .p3 { animation-duration: 5s; animation-delay: -4s; }
    .p4 { animation-duration: 9s; animation-delay: -1s; }
    @keyframes flow { from { stroke-dashoffset: 1470; } to { stroke-dashoffset: 0; } }

    .live { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

    .rotor { transform-origin: 985px 190px; animation: spin 5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .blip { opacity: 0; animation: ping 5s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .b2 { animation-delay: 1.6s; } .b3 { animation-delay: 3.1s; } .b4 { animation-delay: 4.2s; }
    @keyframes ping { 0% { opacity: 0; transform: scale(.4); } 8% { opacity: 1; transform: scale(1.4); } 40% { opacity: .9; transform: scale(1); } 100% { opacity: 0; } }

    .line { opacity: 0; animation: cycle 12s infinite; }
    .l2 { animation-delay: 4s; } .l3 { animation-delay: 8s; }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(8px); } 4%,30% { opacity: 1; transform: translateY(0); } 34%,100% { opacity: 0; transform: translateY(-8px); } }

    .caret { animation: blink 1s steps(1) infinite; }
    .rise { animation: rise 1.2s ease-out both; }
    .rise2 { animation-delay: .25s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    text { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <!-- fiber lines -->
    <g>
      <path class="fiber base" d="M-20 300 C 240 300, 360 250, 620 262 S 980 330, 1220 300"/>
      <path class="fiber base" d="M-20 330 C 300 330, 420 300, 700 310 S 1000 352, 1220 340"/>
      <path class="fiber base" d="M-20 60 C 260 60, 420 96, 660 84 S 1000 40, 1220 64"/>
      <path class="fiber base" d="M-20 30 C 280 30, 500 52, 760 44 S 1060 20, 1220 34"/>

      <path class="fiber pulse"    stroke="#22D3EE" d="M-20 300 C 240 300, 360 250, 620 262 S 980 330, 1220 300"/>
      <path class="fiber pulse p2" stroke="#F5B83D" d="M-20 330 C 300 330, 420 300, 700 310 S 1000 352, 1220 340"/>
      <path class="fiber pulse p3" stroke="#8B5CF6" d="M-20 60 C 260 60, 420 96, 660 84 S 1000 40, 1220 64"/>
      <path class="fiber pulse p4" stroke="#22D3EE" d="M-20 30 C 280 30, 500 52, 760 44 S 1060 20, 1220 34"/>
    </g>

    <!-- status label -->
    <g class="rise">
      <rect x="72" y="104" width="322" height="30" rx="15" fill="#0E1A30" stroke="#1F3357"/>
      <circle class="live" cx="92" cy="119" r="5" fill="#34D399"/>
      <text class="mono" x="106" y="124" font-size="13" fill="#9FB3D1" letter-spacing="1.5">LIVE · TRANSMITTING FROM BR</text>
    </g>

    <!-- name -->
    <g class="rise rise2">
      <text x="68" y="206" font-size="76" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Silas Lopes</text>
      <text x="72" y="246" font-size="22" fill="#C9D6EA" font-weight="500">AI Engineer <tspan fill="#3A4D70">/</tspan> agents that act on real networks</text>
    </g>

    <!-- cycling now-line -->
    <g class="mono" font-size="15" fill="#22D3EE">
      <text x="72" y="282" fill="#5E7396">&gt;</text>
      <text class="line"    x="90" y="282">turning network alerts into decisions</text>
      <text class="line l2" x="90" y="282" fill="#F5B83D">shipping SaaS, mobile &amp; WhatsApp products</text>
      <text class="line l3" x="90" y="282" fill="#B79CFF">teaching LLMs to use real tools</text>
    </g>

    <!-- radar -->
    <g>
      <circle cx="985" cy="190" r="120" fill="#081224" stroke="#1C3157" stroke-width="1.5"/>
      <circle cx="985" cy="190" r="80"  fill="none" stroke="#16294A"/>
      <circle cx="985" cy="190" r="40"  fill="none" stroke="#16294A"/>
      <line x1="865" y1="190" x2="1105" y2="190" stroke="#16294A"/>
      <line x1="985" y1="70"  x2="985"  y2="310" stroke="#16294A"/>
      <g clip-path="url(#radarClip)">
        <g class="rotor">
          <path d="M985 190 L1105 190 A120 120 0 0 0 1070 105 Z" fill="url(#sweep)"/>
          <line x1="985" y1="190" x2="1105" y2="190" stroke="#7DEBFF" stroke-width="2"/>
        </g>
      </g>
      <circle class="blip"    cx="1035" cy="150" r="5" fill="#22D3EE"/>
      <circle class="blip b2" cx="940"  cy="120" r="4" fill="#F5B83D"/>
      <circle class="blip b3" cx="920"  cy="230" r="5" fill="#8B5CF6"/>
      <circle class="blip b4" cx="1050" cy="245" r="4" fill="#34D399"/>
      <circle cx="985" cy="190" r="4" fill="#E6FBFF"/>
      <text class="mono" x="985" y="336" font-size="11" fill="#4F6488" text-anchor="middle" letter-spacing="2">SCANNING FOR PROBLEMS WORTH SOLVING</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="21.5" fill="none" stroke="#1D2C4A" stroke-width="1.5"/>
</svg>
